name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest

  docker:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t routeopt .
      - run: docker run --rm routeopt --help
      - name: End-to-end smoke test inside the container
        run: |
          docker run --rm -v "$PWD":/data routeopt generate --n 20 --out orders.csv
          docker run --rm -v "$PWD":/data routeopt solve --orders orders.csv --capacity 30
